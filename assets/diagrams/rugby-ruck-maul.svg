<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>ラックとモールの違い。ラックはボールが地面にあり、モールは選手がボールを持ち上げたまま組み合っている。どちらも両チーム1人以上が立ったまま組み合う</title>
<rect width="640" height="420" fill="#ffffff"/>
<text x="160" y="34" font-size="22" text-anchor="middle" fill="#1f2a44" font-weight="bold">ラック</text>
<text x="480" y="34" font-size="22" text-anchor="middle" fill="#1f2a44" font-weight="bold">モール</text>
<line x1="320" y1="50" x2="320" y2="360" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="30" y="56" width="260" height="160" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<circle cx="100" cy="100" r="17" fill="#2f6fd6"/>
<circle cx="100" cy="162" r="17" fill="#2f6fd6"/>
<circle cx="220" cy="100" r="17" fill="#d64545"/>
<circle cx="220" cy="162" r="17" fill="#d64545"/>
<line x1="100" y1="117" x2="150" y2="126" stroke="#1f2a44" stroke-width="2"/>
<line x1="100" y1="145" x2="150" y2="136" stroke="#1f2a44" stroke-width="2"/>
<line x1="220" y1="117" x2="170" y2="126" stroke="#1f2a44" stroke-width="2"/>
<line x1="220" y1="145" x2="170" y2="136" stroke="#1f2a44" stroke-width="2"/>
<ellipse cx="160" cy="131" rx="16" ry="10" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<text x="160" y="204" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="normal">上から見た図</text>
<rect x="350" y="56" width="260" height="160" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<circle cx="400" cy="131" r="17" fill="#2f6fd6"/>
<circle cx="442" cy="131" r="17" fill="#2f6fd6"/>
<circle cx="484" cy="131" r="17" fill="#2f6fd6" stroke="#1f2a44" stroke-width="2"/>
<circle cx="556" cy="131" r="17" fill="#d64545"/>
<line x1="417" y1="131" x2="425" y2="131" stroke="#1f2a44" stroke-width="4"/>
<line x1="459" y1="131" x2="467" y2="131" stroke="#1f2a44" stroke-width="4"/>
<line x1="501" y1="131" x2="539" y2="131" stroke="#1f2a44" stroke-width="4"/>
<ellipse cx="500" cy="102" rx="14" ry="9" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<text x="500" y="80" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ボールを持つ選手</text>
<text x="480" y="204" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="normal">上から見た図</text>
<text x="160" y="252" font-size="16" text-anchor="middle" fill="#9aa3b2" font-weight="bold">横から見ると</text>
<line x1="60" y1="310" x2="260" y2="310" stroke="#1f2a44" stroke-width="3"/>
<ellipse cx="160" cy="299" rx="16" ry="10" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<text x="160" y="340" font-size="17" text-anchor="middle" fill="#1f2a44" font-weight="bold">ボールは地面にある</text>
<text x="480" y="252" font-size="16" text-anchor="middle" fill="#9aa3b2" font-weight="bold">横から見ると</text>
<line x1="380" y1="310" x2="580" y2="310" stroke="#1f2a44" stroke-width="3"/>
<ellipse cx="480" cy="272" rx="16" ry="10" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<line x1="480" y1="284" x2="480" y2="306" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="3 3"/>
<text x="480" y="340" font-size="17" text-anchor="middle" fill="#1f2a44" font-weight="bold">ボールは持ち上げられている</text>
<rect x="30" y="370" width="580" height="38" rx="8" fill="#fff7e0" stroke="#f2a900" stroke-width="2"/>
<text x="320" y="395" font-size="17" text-anchor="middle" fill="#1f2a44" font-weight="bold">どちらも両チームが1人以上ずつ、立ったまま組み合う</text>
</svg>
