<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>オフサイドラインの位置。ふだんのプレーではボールを持つ味方、ラックやモールでは最後尾の足、スクラムでは最後尾の足から5m後ろが境目。境目より前でプレーに加わると反則</title>
<rect width="640" height="560" fill="#ffffff"/>
<text x="24" y="28" font-size="19" text-anchor="start" fill="#1f2a44" font-weight="bold">①ふだんのプレー（ボールを持つ味方が基準）</text>
<rect x="20" y="40" width="600" height="150" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<line x1="520" y1="168" x2="604" y2="168" stroke="#1f2a44" stroke-width="3"/>
<polygon points="604,168 595.9,171.9 595.9,164.1" fill="#1f2a44"/>
<text x="512" y="174" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="bold">攻める向き</text>
<line x1="330" y1="44" x2="330" y2="186" stroke="#1f2a44" stroke-width="3" stroke-dasharray="8 6"/>
<text x="322" y="62" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">境目</text>
<circle cx="330" cy="125" r="15" fill="#2f6fd6" stroke="#1f2a44" stroke-width="2"/>
<ellipse cx="330" cy="100" rx="12" ry="8" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<circle cx="250" cy="90" r="15" fill="#2f6fd6"/>
<circle cx="270" cy="150" r="15" fill="#2f6fd6"/>
<circle cx="440" cy="120" r="15" fill="#2f6fd6"/>
<line x1="425" y1="105" x2="455" y2="135" stroke="#d64545" stroke-width="4"/>
<line x1="455" y1="105" x2="425" y2="135" stroke="#d64545" stroke-width="4"/>
<text x="440" y="80" font-size="16" text-anchor="middle" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">前にいると</text>
<text x="440" y="100" font-size="16" text-anchor="middle" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">オフサイド</text>
<text x="250" y="178" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">後ろ・横ならプレーに加われる</text>
<text x="24" y="220" font-size="19" text-anchor="start" fill="#1f2a44" font-weight="bold">②ラック・モール（最後尾の足が基準）</text>
<rect x="20" y="232" width="600" height="150" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<circle cx="300" cy="305" r="15" fill="#2f6fd6"/>
<circle cx="330" cy="305" r="15" fill="#2f6fd6"/>
<circle cx="360" cy="305" r="15" fill="#d64545"/>
<circle cx="390" cy="305" r="15" fill="#d64545"/>
<ellipse cx="345" cy="335" rx="11" ry="7" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<line x1="286" y1="236" x2="286" y2="378" stroke="#2f6fd6" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="404" y1="236" x2="404" y2="378" stroke="#d64545" stroke-width="3" stroke-dasharray="8 6"/>
<text x="278" y="262" font-size="16" text-anchor="end" fill="#2f6fd6" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">自チームの境目</text>
<text x="412" y="262" font-size="16" text-anchor="start" fill="#d64545" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">相手の境目</text>
<text x="140" y="330" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">最後尾の足を通る線</text>
<text x="140" y="352" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">より後ろから参加する</text>
<text x="24" y="410" font-size="19" text-anchor="start" fill="#1f2a44" font-weight="bold">③スクラム（最後尾の足から5m後ろ）</text>
<rect x="20" y="422" width="600" height="128" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<rect x="190" y="470" width="120" height="48" rx="8" fill="#dbe7fb" stroke="#2f6fd6" stroke-width="2"/>
<rect x="330" y="470" width="120" height="48" rx="8" fill="#fbe0e0" stroke="#d64545" stroke-width="2"/>
<text x="250" y="500" font-size="16" text-anchor="middle" fill="#2f6fd6" font-weight="bold">スクラム</text>
<text x="390" y="500" font-size="16" text-anchor="middle" fill="#d64545" font-weight="bold">スクラム</text>
<line x1="120" y1="428" x2="120" y2="546" stroke="#2f6fd6" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="520" y1="428" x2="520" y2="546" stroke="#d64545" stroke-width="3" stroke-dasharray="8 6"/>
<line x1="188" y1="452" x2="124" y2="452" stroke="#1f2a44" stroke-width="2"/>
<polygon points="124,452 132.1,448.1 132.1,455.9" fill="#1f2a44"/>
<text x="156" y="444" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5m</text>
<line x1="452" y1="452" x2="516" y2="452" stroke="#1f2a44" stroke-width="2"/>
<polygon points="516,452 507.9,455.9 507.9,448.1" fill="#1f2a44"/>
<text x="484" y="444" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5m</text>
<circle cx="70" cy="500" r="13" fill="#2f6fd6"/>
<circle cx="70" cy="528" r="13" fill="#2f6fd6"/>
<circle cx="570" cy="500" r="13" fill="#d64545"/>
<circle cx="570" cy="528" r="13" fill="#d64545"/>
</svg>
