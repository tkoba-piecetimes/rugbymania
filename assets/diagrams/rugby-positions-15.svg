<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>ラグビーの15ポジション。1〜8番がフォワード、9〜15番がバックス。スクラムの場面の並びの一例</title>
<rect width="640" height="590" fill="#ffffff"/>
<text x="320" y="32" font-size="20" text-anchor="middle" fill="#1f2a44" font-weight="bold">15人のポジション（スクラムの場面の一例）</text>
<rect x="20" y="50" width="600" height="330" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<line x1="590" y1="112" x2="590" y2="70" stroke="#1f2a44" stroke-width="3"/>
<polygon points="590,70 593.9,78.1 586.1,78.1" fill="#1f2a44"/>
<text x="572" y="92" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">攻める向き</text>
<circle cx="215" cy="170" r="16" fill="#2f6fd6"/>
<text x="215" y="175.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="255" cy="170" r="16" fill="#2f6fd6"/>
<text x="255" y="175.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<circle cx="295" cy="170" r="16" fill="#2f6fd6"/>
<text x="295" y="175.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<circle cx="235" cy="205" r="16" fill="#2f6fd6"/>
<text x="235" y="210.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="275" cy="205" r="16" fill="#2f6fd6"/>
<text x="275" y="210.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<circle cx="215" cy="240" r="16" fill="#2f6fd6"/>
<text x="215" y="245.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">6</text>
<circle cx="255" cy="240" r="16" fill="#2f6fd6"/>
<text x="255" y="245.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">8</text>
<circle cx="295" cy="240" r="16" fill="#2f6fd6"/>
<text x="295" y="245.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">7</text>
<circle cx="372" cy="258" r="16" fill="#f2a900"/>
<text x="372" y="263.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">9</text>
<circle cx="425" cy="290" r="16" fill="#f2a900"/>
<text x="425" y="295.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">10</text>
<circle cx="475" cy="308" r="16" fill="#f2a900"/>
<text x="475" y="313.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">12</text>
<circle cx="525" cy="326" r="16" fill="#f2a900"/>
<text x="525" y="331.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">13</text>
<circle cx="575" cy="344" r="16" fill="#f2a900"/>
<text x="575" y="349.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">14</text>
<circle cx="60" cy="310" r="16" fill="#f2a900"/>
<text x="60" y="315.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">11</text>
<circle cx="255" cy="350" r="16" fill="#f2a900"/>
<text x="255" y="355.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">15</text>
<rect x="190" y="150" width="126" height="112" rx="10" fill="none" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="6 4"/>
<text x="180" y="140" font-size="16" text-anchor="start" fill="#2f6fd6" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">スクラム</text>
<circle cx="40" cy="414" r="10" fill="#2f6fd6"/>
<text x="58" y="420" font-size="17" text-anchor="start" fill="#1f2a44" font-weight="bold">フォワード（FW）1〜8番</text>
<circle cx="340" cy="414" r="10" fill="#f2a900"/>
<text x="358" y="420" font-size="17" text-anchor="start" fill="#1f2a44" font-weight="bold">バックス（BK）9〜15番</text>
<text x="58" y="458" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">1・3番　プロップ</text>
<text x="58" y="484" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">2番　フッカー</text>
<text x="58" y="510" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">4・5番　ロック</text>
<text x="58" y="536" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">6・7番　フランカー</text>
<text x="58" y="562" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">8番　ナンバーエイト</text>
<text x="358" y="458" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">9番　スクラムハーフ</text>
<text x="358" y="484" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">10番　スタンドオフ</text>
<text x="358" y="510" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">11・14番　ウイング</text>
<text x="358" y="536" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">12・13番　センター</text>
<text x="358" y="562" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">15番　フルバック</text>
</svg>
