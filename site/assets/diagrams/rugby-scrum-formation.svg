<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>スクラムの並び（3-4-1）。自チームは前列3人（1・2・3番）、2列目にロック2人（4・5番）とその両脇にフランカー2人（6・7番）、最後尾に8番が並んで相手と向かい合う。9番のスクラムハーフが1番の側からボールを入れる</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="34" font-size="20" text-anchor="middle" fill="#1f2a44" font-weight="bold">スクラムの並び（上から見た図）</text>
<rect x="60" y="60" width="520" height="236" rx="8" fill="#e8f3e8" stroke="#9aa3b2" stroke-width="1"/>
<line x1="320" y1="66" x2="320" y2="290" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="6 5"/>
<circle cx="360" cy="240" r="15" fill="#2f6fd6"/>
<text x="360" y="245.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">1</text>
<circle cx="360" cy="200" r="15" fill="#2f6fd6"/>
<text x="360" y="205.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<circle cx="360" cy="160" r="15" fill="#2f6fd6"/>
<text x="360" y="165.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">3</text>
<circle cx="402" cy="220" r="15" fill="#1f2a44"/>
<text x="402" y="225.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">4</text>
<circle cx="402" cy="180" r="15" fill="#1f2a44"/>
<text x="402" y="185.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">5</text>
<circle cx="402" cy="262" r="15" fill="#f2a900"/>
<text x="402" y="267.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">6</text>
<circle cx="402" cy="138" r="15" fill="#f2a900"/>
<text x="402" y="143.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">7</text>
<circle cx="444" cy="200" r="15" fill="#f2a900"/>
<text x="444" y="205.6" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">8</text>
<circle cx="280" cy="160" r="15" fill="#d64545"/>
<circle cx="280" cy="200" r="15" fill="#d64545"/>
<circle cx="280" cy="240" r="15" fill="#d64545"/>
<circle cx="238" cy="138" r="15" fill="#d64545"/>
<circle cx="238" cy="180" r="15" fill="#d64545"/>
<circle cx="238" cy="220" r="15" fill="#d64545"/>
<circle cx="238" cy="262" r="15" fill="#d64545"/>
<circle cx="196" cy="200" r="15" fill="#d64545"/>
<text x="530" y="206" font-size="18" text-anchor="middle" fill="#2f6fd6" font-weight="bold">自チーム</text>
<text x="110" y="206" font-size="18" text-anchor="middle" fill="#d64545" font-weight="bold">相手チーム</text>
<circle cx="320" cy="330" r="15" fill="#2f6fd6"/>
<text x="320" y="335.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">9</text>
<line x1="320" y1="313" x2="320" y2="282" stroke="#1f2a44" stroke-width="2.5"/>
<polygon points="320,282 323.9,290.1 316.1,290.1" fill="#1f2a44"/>
<ellipse cx="320" cy="274" rx="11" ry="7" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<text x="350" y="336" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">9番が1番の側からボールを入れる</text>
<circle cx="70" cy="372" r="10" fill="#2f6fd6"/>
<text x="88" y="378" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">前列（1〜3番）</text>
<circle cx="230" cy="372" r="10" fill="#1f2a44"/>
<text x="248" y="378" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">ロック（4・5番）</text>
<circle cx="420" cy="372" r="10" fill="#f2a900"/>
<text x="438" y="378" font-size="16" text-anchor="start" fill="#1f2a44" font-weight="normal">6・7・8番</text>
</svg>
