<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic','Meiryo',sans-serif">
<title>ラインアウトの並び。タッチラインから5mと15mの間に両チームが向かい合って2列に並び、フッカーがタッチラインの外から2列の間にボールを投げ入れる。参加しない選手は10m以上離れる</title>
<rect width="640" height="400" fill="#ffffff"/>
<text x="320" y="26" font-size="20" text-anchor="middle" fill="#1f2a44" font-weight="bold">ラインアウトの並び（上から見た図）</text>
<rect x="60" y="76" width="520" height="294" rx="0" fill="#e8f3e8" stroke="none" stroke-width="0"/>
<line x1="60" y1="76" x2="580" y2="76" stroke="#1f2a44" stroke-width="3"/>
<line x1="60" y1="146" x2="580" y2="146" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="10 8"/>
<line x1="60" y1="286" x2="580" y2="286" stroke="#9aa3b2" stroke-width="2" stroke-dasharray="10 8"/>
<text x="574" y="100" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">タッチライン</text>
<text x="574" y="140" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">5m線</text>
<text x="574" y="280" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">15m線</text>
<line x1="320" y1="76" x2="320" y2="366" stroke="#9aa3b2" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="299" cy="160" r="13" fill="#2f6fd6"/>
<circle cx="341" cy="160" r="13" fill="#d64545"/>
<circle cx="299" cy="195" r="13" fill="#2f6fd6"/>
<circle cx="341" cy="195" r="13" fill="#d64545"/>
<circle cx="299" cy="230" r="13" fill="#2f6fd6"/>
<circle cx="341" cy="230" r="13" fill="#d64545"/>
<circle cx="299" cy="265" r="13" fill="#2f6fd6"/>
<circle cx="341" cy="265" r="13" fill="#d64545"/>
<circle cx="320" cy="52" r="13" fill="#2f6fd6"/>
<text x="320" y="57.6" font-size="16" text-anchor="middle" fill="#ffffff" font-weight="bold">2</text>
<ellipse cx="320" cy="68" rx="9" ry="6" fill="#f2a900" stroke="#1f2a44" stroke-width="1.5"/>
<text x="345" y="50" font-size="16" text-anchor="start" fill="#2f6fd6" font-weight="bold">投げ入れる人（フッカー）</text>
<line x1="226" y1="215" x2="282" y2="215" stroke="#1f2a44" stroke-width="2"/>
<polygon points="282,215 273.9,218.9 273.9,211.1" fill="#1f2a44"/>
<text x="222" y="211" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">持ち上げられて</text>
<text x="222" y="231" font-size="16" text-anchor="end" fill="#1f2a44" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">跳ぶ選手がいる</text>
<line x1="180" y1="150" x2="180" y2="366" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="460" y1="150" x2="460" y2="366" stroke="#d64545" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="185" y1="330" x2="315" y2="330" stroke="#1f2a44" stroke-width="2"/>
<polygon points="315,330 306.9,333.9 306.9,326.1" fill="#1f2a44"/>
<text x="250" y="322" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">10m</text>
<text x="112" y="350" font-size="16" text-anchor="middle" fill="#2f6fd6" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">参加しない</text>
<text x="112" y="372" font-size="16" text-anchor="middle" fill="#2f6fd6" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">味方はこの外</text>
<text x="530" y="350" font-size="16" text-anchor="middle" fill="#d64545" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">参加しない</text>
<text x="530" y="372" font-size="16" text-anchor="middle" fill="#d64545" font-weight="normal" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">相手はこの外</text>
</svg>
