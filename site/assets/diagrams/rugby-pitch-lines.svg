<text x="320" y="478" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold">長さ94〜100m（トライライン間）／幅68〜70m</text>
<text x="320" y="504" font-size="15" text-anchor="middle" fill="#1f2a44" font-weight="normal">金色のHはゴールポスト　※縮尺は実際と異なります</text>
