<text x="589" y="265" font-size="16" text-anchor="middle" fill="#1f2a44" font-weight="bold" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke" transform="rotate(90 589 265)">インゴール</text>
